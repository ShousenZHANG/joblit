name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Dummy values so `next build` (and any test that reads env) passes without
# real secrets. These are NOT credentials -- they only satisfy module-load
# guards like prisma.ts's DATABASE_URL check; no service is contacted in CI.
env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  AUTH_SECRET: ci-dummy-auth-secret-not-real
  FETCH_RUN_SECRET: ci-dummy
  LATEX_RENDER_URL: https://example.com/render
  LATEX_RENDER_TOKEN: ci-dummy
  GOOGLE_CLIENT_ID: ci-dummy
  GOOGLE_CLIENT_SECRET: ci-dummy
  GITHUB_ID: ci-dummy
  GITHUB_SECRET: ci-dummy
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Enforce dependency policy
        run: npm run deps:policy

      - name: Enforce manifest and repository security policy
        run: node tools/ci/check-security-policy.mjs

      - name: Test deployment-order policy
        run: node --test tools/deploy/vercel-build.test.mjs

      - name: Apply the complete migration history and prove schema convergence
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-schema=prisma/schema.prisma --to-config-datasource --exit-code

      - name: Prove the post-retirement inventory deployment fence
        run: |
          gate_database=postgresql://ci:ci@localhost:5432/ci_retirement_gate
          verifier=prisma/migrations/20260809161000_verify_post_retirement_inventory/migration.sql
          psql postgresql://ci:ci@localhost:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ci_retirement_gate WITH TEMPLATE ci'
          psql "$gate_database" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "User" (
            "id", "email", "createdAt", "updatedAt"
          ) VALUES (
            '00000000-0000-4000-8000-000000000001',
            'stage2-gate@example.invalid',
            CURRENT_TIMESTAMP,
            CURRENT_TIMESTAMP
          );
          UPDATE "ApplicationArtifactInventoryCheckpoint"
          SET
            "cursor" = NULL,
            "claimId" = NULL,
            "claimLeaseExpiresAt" = NULL,
            "scanStartedAt" = NULL,
            "completedAt" = (
              SELECT "finished_at" AT TIME ZONE 'UTC' - INTERVAL '1 second'
              FROM "_prisma_migrations"
              WHERE "migration_name" = '20260809154500_drop_retired_source_tables'
                AND "rolled_back_at" IS NULL
              ORDER BY "finished_at" DESC
              LIMIT 1
            )
          WHERE "key" = 'vercel-applications-v1';
          SQL
          if psql "$gate_database" -v ON_ERROR_STOP=1 -f "$verifier"; then
            echo 'post-retirement gate accepted a stale Blob inventory' >&2
            exit 1
          fi
          psql "$gate_database" -v ON_ERROR_STOP=1 <<'SQL'
          UPDATE "ApplicationArtifactInventoryCheckpoint"
          SET "completedAt" = (
            SELECT "finished_at" AT TIME ZONE 'UTC' + INTERVAL '1 second'
            FROM "_prisma_migrations"
            WHERE "migration_name" = '20260809154500_drop_retired_source_tables'
              AND "rolled_back_at" IS NULL
            ORDER BY "finished_at" DESC
            LIMIT 1
          )
          WHERE "key" = 'vercel-applications-v1';
          SQL
          psql "$gate_database" -v ON_ERROR_STOP=1 -f "$verifier"
          psql "$gate_database" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "ApplicationArtifact" (
            "id", "userId", "jobId", "target", "pathname", "state",
            "stagedAt", "createdAt", "updatedAt"
          ) VALUES (
            '00000000-0000-4000-8000-000000000002',
            '00000000-0000-4000-8000-000000000001',
            '00000000-0000-4000-8000-000000000003',
            'RESUME_PDF',
            'applications/stage2-orphan.pdf',
            'STAGED',
            CURRENT_TIMESTAMP,
            CURRENT_TIMESTAMP,
            CURRENT_TIMESTAMP
          );
          SQL
          if psql "$gate_database" -v ON_ERROR_STOP=1 -f "$verifier"; then
            echo 'post-retirement gate accepted an active orphan Artifact' >&2
            exit 1
          fi
          psql "$gate_database" -v ON_ERROR_STOP=1 <<'SQL'
          DELETE FROM "ApplicationArtifact"
          WHERE "id" = '00000000-0000-4000-8000-000000000002';
          SQL
          psql "$gate_database" -v ON_ERROR_STOP=1 -f "$verifier"

      - name: Prove production drift converges through expand and contract migrations
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_legacy
        run: |
          psql postgresql://ci:ci@localhost:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ci_legacy'
          for migration in prisma/migrations/*/migration.sql; do
            case "$migration" in
              *20260731130000*|*20260731135000*|*20260731140000*) break ;;
            esac
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'ALTER TABLE "Application" DROP COLUMN "locale"; ALTER TABLE "ActiveResumeProfile" ALTER COLUMN "updatedAt" DROP DEFAULT; CREATE UNIQUE INDEX "ApplicationArtifact_pathname_key" ON "ApplicationArtifact"("pathname"); CREATE UNIQUE INDEX "ApplicationArtifact_url_key" ON "ApplicationArtifact"("url")'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260731130000_agent_runtime_expand_and_artifact_reconciliation/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260731135000_schema_convergence_expand/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('"ApplicationArtifact_pathname_key"') IS NULL
              OR to_regclass('"ApplicationArtifact_url_key"') IS NULL
            THEN
              RAISE EXCEPTION 'expand deployment removed a legacy writer index';
            END IF;
          END
          $$;
          SQL
          psql postgresql://ci:ci@localhost:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ci_bad WITH TEMPLATE ci_legacy'
          psql postgresql://ci:ci@localhost:5432/ci_bad -v ON_ERROR_STOP=1 -c 'DROP INDEX "ApplicationArtifact_pathname_key"; CREATE INDEX "ApplicationArtifact_pathname_key" ON "ApplicationArtifact"("pathname")'
          if psql postgresql://ci:ci@localhost:5432/ci_bad -v ON_ERROR_STOP=1 -f prisma/migrations/20260731140000_drop_extension_token_and_legacy_artifact_uniques/migration.sql; then
            echo 'contract migration accepted a malformed legacy index' >&2
            exit 1
          fi
          psql postgresql://ci:ci@localhost:5432/ci_bad -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('"ExtensionToken"') IS NULL
              OR NOT EXISTS (
                SELECT 1
                FROM pg_index
                WHERE indexrelid = to_regclass('"ApplicationArtifact_pathname_key"')
                  AND NOT indisunique
              )
            THEN
              RAISE EXCEPTION 'failed contract migration did not roll back';
            END IF;
          END
          $$;
          SQL
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260731140000_drop_extension_token_and_legacy_artifact_uniques/migration.sql
          replay_post_contract_migrations=false
          for migration in prisma/migrations/*/migration.sql; do
            case "$migration" in
              *20260731140000_drop_extension_token_and_legacy_artifact_uniques*)
                replay_post_contract_migrations=true
                continue
                ;;
            esac
            if [ "$replay_post_contract_migrations" = true ]; then
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
            fi
          done
          if [ "$replay_post_contract_migrations" != true ]; then
            echo 'post-contract migration anchor was not found' >&2
            exit 1
          fi
          npx prisma migrate diff --from-schema=prisma/schema.prisma --to-config-datasource --exit-code

      - name: Audit production dependencies
        run: npm run deps:audit

      - name: Dead-code and dependency gate
        run: npm run deadcode

      - name: Lint
        run: npm run lint

      - name: Test (with coverage ratchet)
        run: npm run test:coverage

      - name: Build
        run: npm run build

  python-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install worker deps
        run: pip install -r tools/fetcher/requirements-dev.txt

      - name: Test fetcher
        run: python -m pytest tools/fetcher -q
