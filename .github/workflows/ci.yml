name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Dummy values so `next build` (and any test that reads env) passes without
# real secrets. These are NOT credentials -- they only satisfy module-load
# guards like prisma.ts's DATABASE_URL check; no service is contacted in CI.
env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  AUTH_SECRET: ci-dummy-auth-secret-not-real
  APP_ENC_KEY: dGVzdHRlc3R0ZXN0dGVzdHRlc3R0ZXN0dGVzdDEyMw==
  IMPORT_SECRET: ci-dummy
  FETCH_RUN_SECRET: ci-dummy
  LATEX_RENDER_URL: https://example.com/render
  LATEX_RENDER_TOKEN: ci-dummy
  GOOGLE_CLIENT_ID: ci-dummy
  GOOGLE_CLIENT_SECRET: ci-dummy
  GITHUB_ID: ci-dummy
  GITHUB_SECRET: ci-dummy
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            chrome-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install extension dependencies
        run: npm ci
        working-directory: chrome-extension

      - name: Enforce dependency policy
        run: npm run deps:policy

      - name: Audit production dependencies
        run: npm run deps:audit

      - name: Dead-code and dependency gate
        run: npm run deadcode

      - name: Lint
        run: npm run lint

      - name: Test (with coverage ratchet)
        run: npm run test:coverage

      - name: Test Hermes profile packaging and signatures
        run: npm run hermes:package:test

      - name: Audit extension production dependencies
        run: npm run deps:audit
        working-directory: chrome-extension

      - name: Test extension (with coverage ratchet)
        run: npm run test:coverage
        working-directory: chrome-extension

      - name: Build extension
        run: npm run build
        working-directory: chrome-extension

      - name: Build
        run: npm run build

  python-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install worker deps
        run: pip install -r tools/fetcher/requirements-dev.txt

      - name: Test fetcher
        run: python -m pytest tools/fetcher -q
