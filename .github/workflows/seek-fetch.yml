name: Seek Fetch

on:
  workflow_dispatch:
    inputs:
      runId:
        description: "FetchRun id (uuid)"
        required: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/fetcher/requirements.txt

      - name: Run seek and import
        env:
          RUN_ID: ${{ inputs.runId }}
          JOBLIT_WEB_URL: ${{ secrets.JOBLIT_WEB_URL }}
          IMPORT_SECRET: ${{ secrets.IMPORT_SECRET }}
          FETCH_RUN_SECRET: ${{ secrets.FETCH_RUN_SECRET }}
          # Kill-switch: the worker refuses to hit Seek unless this is true.
          SEEK_FETCH_ENABLED: ${{ secrets.SEEK_FETCH_ENABLED }}
          # Optional UA override (default is the honest Joblit-Fetcher token).
          SEEK_USER_AGENT: ${{ secrets.SEEK_USER_AGENT }}
        run: |
          python tools/fetcher/run_seek.py
